<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#14052c;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
color:white;
overflow-y:auto;
}

h1{
margin-top:20px;
font-size:30px;
}

.btn{
margin-top:20px;
padding:14px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
}

.info{
margin-top:15px;
font-size:18px;
}

.board{

display:none;

grid-template-columns:repeat(10,32px);

gap:4px;

justify-content:center;

margin-top:25px;

padding-bottom:60px;
}

.cell{

width:32px;

height:32px;

background:#2d1d54;

border-radius:6px;

display:flex;

align-items:center;

justify-content:center;

font-size:11px;

color:white;

user-select:none;

cursor:pointer;
}

.marked{
background:orange;
}

</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<button class="btn" onclick="startGame()">

▶️ Play 10

</button>

<div class="info">

Selected Boards:
<span id="count">0</span>/2

</div>

<div class="board" id="board"></div>

<script>

let selectedCount = 0

function startGame(){

let board=document.getElementById("board")

board.innerHTML=""

board.style.display="grid"

selectedCount = 0

document.getElementById("count").innerHTML = selectedCount

for(let i=1;i<=400;i++){

let cell=document.createElement("div")

cell.className="cell"

cell.innerHTML=i

cell.onclick=function(){

if(cell.classList.contains("marked")){

cell.classList.remove("marked")

selectedCount--

document.getElementById("count").innerHTML = selectedCount

return

}

if(selectedCount >= 2){

alert("❌ You can only select 2 boards")

return

}

cell.classList.add("marked")

selectedCount++

document.getElementById("count").innerHTML = selectedCount

}

board.appendChild(cell)

}

}

</script>

</body>

</html>
