<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#d8b9e6;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
color:white;
overflow-y:auto;
}

h1{
margin-top:40px;
font-size:38px;
font-weight:bold;
color:purple;
}

.btn{
margin-top:25px;
padding:18px 55px;
font-size:26px;
border:none;
border-radius:22px;
background:#00d84f;
color:white;
cursor:pointer;
}

.welcome{
font-size:42px;
font-weight:bold;
color:white;
margin-top:80px;
text-shadow:0 0 15px rgba(255,255,255,0.5);
animation:fade 2s infinite alternate;
}

.hideWelcome{
display:none;
}

@keyframes fade{
from{
opacity:0.5;
transform:scale(0.95);
}
to{
opacity:1;
transform:scale(1);
}
}

.board{
display:none;
grid-template-columns:repeat(10,26px);
gap:8px;
justify-content:center;
margin-top:25px;
padding-bottom:40px;
}

.cell{
width:26px;
height:26px;
background:#d7cfe6;
border:2px solid #e8e1f0;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:bold;
color:white;
user-select:none;
cursor:pointer;
}

.marked{
background:orange;
border:2px solid #ffcc80;
}
#calledNumber{
font-size:70px;
font-weight:bold;
color:orange;
margin-top:25px;
text-shadow:0 0 20px orange;
}
</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<div class="welcome" id="welcomeText">
Welcome to Smart Bingo
</div>

<button class="btn" onclick="startGame()">
▶️ Play 10
</button>
<br><br>

<button class="btn" onclick="callNumber()">
🎲 Call Number
</button>

<div id="calledNumber">
0
</div>
<div class="board" id="board"></div>

<script>

function startGame(){
function callNumber(){

let randomNumber = Math.floor(Math.random() * 400) + 1

document.getElementById("calledNumber").innerHTML = randomNumber

}
document.getElementById("welcomeText").classList.add("hideWelcome")

let board = document.getElementById("board")

board.innerHTML = ""

board.style.display = "grid"

for(let i=1;i<=400;i++){

let cell = document.createElement("div")

cell.className = "cell"

cell.innerHTML = i

cell.onclick = function(){

cell.classList.toggle("marked")

}

board.appendChild(cell)
}
}

</script>

</body>
</html>
