<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
    background:#14052c;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:0;
}

h1{
    padding-top:20px;
    font-size:35px;
}

.top{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.btn{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    font-size:20px;
    color:white;
    background:linear-gradient(to right,#00c853,#2962ff);
}

.board{
    display:grid;
    grid-template-columns:repeat(10,45px);
    gap:8px;
    justify-content:center;
    margin-top:30px;
    padding-bottom:50px;
}

.cell{
    width:45px;
    height:45px;
    background:#2c1b52;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
}

.marked{
    background:#ff9800;
}

</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<div class="top">

<button class="btn">
▶ Play 10
</button>

<button class="btn">
▶ Play 50
</button>

<button class="btn">
▶ Play 100
</button>

</div>

<div class="board" id="board"></div>

<script>

let board = document.getElementById("board")

for(let i=1;i<=400;i++){

    let cell=document.createElement("div")

    cell.className="cell"

    cell.innerText=i

    cell.onclick=function(){

        cell.classList.toggle("marked")

    }

    board.appendChild(cell)
}

</script>

</body>

</html>
