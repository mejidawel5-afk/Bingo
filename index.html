<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
    background:#14052c;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:0;
}

h1{
    margin-top:25px;
    font-size:32px;
}

.top{
    margin-top:30px;
}

.btn{
    padding:14px 22px;
    margin:10px;
    border:none;
    border-radius:12px;
    font-size:20px;
    color:white;
    background:linear-gradient(to right,#00c853,#2962ff);
}

.board{
    display:none;
    grid-template-columns:repeat(10,32px);
    gap:5px;
    justify-content:center;
    margin-top:30px;
    padding-bottom:40px;
}

.cell{
    width:32px;
    height:32px;
    background:#2d1d54;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:pointer;
}

.marked{
    background:#ff9800;
}

</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<div class="top">

<button class="btn" onclick="startGame()">
▶️ Play 10
</button>

</div>

<div class="board" id="board"></div>

<script>

let board = document.getElementById("board")

function startGame(){

    board.innerHTML=""

    board.style.display="grid"

    for(let i=1;i<=100;i++){

        let cell=document.createElement("div")

        cell.className="cell"

        cell.innerText=i

        cell.onclick=function(){

            cell.classList.toggle("marked")
        }

        board.appendChild(cell)
    }

    alert("🎉 Game Started")
}

</script>

</body>

</html>
