<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#d8b6e6;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
overflow-y:auto;
}

h1{
margin-top:30px;
font-size:34px;
color:#6a0080;
}

.btn{
margin-top:20px;
padding:16px 40px;
font-size:22px;
border:none;
border-radius:18px;
background:#00c853;
color:white;
font-weight:bold;
cursor:pointer;
}

.info{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#6a0080;
}

.board{
display:none;
grid-template-columns:repeat(5,65px);
gap:10px;
justify-content:center;
margin-top:30px;
padding-bottom:80px;
}

.cell{
width:65px;
height:65px;
background:#d9d0ef;
border:3px solid #e6dff7;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:white;
cursor:pointer;
user-select:none;
font-weight:bold;
}

.marked{
background:orange;
color:white;
}

</style>
</head>

<body>

<h1>🎮 Smart Bingo</h1>

<button class="btn" onclick="startGame()">
▶️ Play 10
</button>

<div class="info">
Selected Boards:
<span id="count">0</span>/2
</div>

<div class="board" id="board"></div>

<script>

let selectedCount = 0;

function startGame(){

let board = document.getElementById("board");

board.innerHTML = "";

board.style.display = "grid";

selectedCount = 0;

document.getElementById("count").innerHTML = selectedCount;

for(let i=1; i<=400; i++){

let cell = document.createElement("div");

cell.className = "cell";

cell.innerHTML = i;

cell.onclick = function(){

if(cell.classList.contains("marked")){

cell.classList.remove("marked");

selectedCount--;

document.getElementById("count").innerHTML = selectedCount;

return;

}

if(selectedCount >= 2){

alert("❌ You can only select 2 boards");

return;

}

cell.classList.add("marked");

selectedCount++;

document.getElementById("count").innerHTML = selectedCount;

};

board.appendChild(cell);

}

}

</script>

</body>
</html>
