<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#d8b9e6;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
color:white;
overflow-y:auto;
}

h1{
margin-top:40px;
font-size:38px;
font-weight:bold;
color:purple;
}

.btn{
margin-top:25px;
padding:18px 55px;
font-size:26px;
border:none;
border-radius:22px;
background:#00d84f;
color:white;
cursor:pointer;
}

.info{
margin-top:18px;
font-size:28px;
font-weight:bold;
color:purple;
}

.board{

display:none;

grid-template-columns:repeat(10,58px);

gap:6px;

justify-content:center;

margin-top:30px;

padding-bottom:60px;
}

.cell{

width:58px;

height:58px;

background:#d7cfe6;

border:2px solid #e8e1f0;

border-radius:16px;

display:flex;

align-items:center;

justify-content:center;

font-size:15px;

color:white;

user-select:none;

cursor:pointer;
}

.marked{
background:orange;
border:2px solid #ffcc80;
}

</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<button class="btn" onclick="startGame()">
▶️ Play 10
</button>

<div class="info">
Selected Boards:
<span id="count">0</span>/2
</div>

<div class="board" id="board"></div>

<script>

let selectedCount = 0

function startGame(){

let board = document.getElementById("board")

board.innerHTML = ""

board.style.display = "grid"

selectedCount = 0

document.getElementById("count").innerHTML = selectedCount

for(let i=1;i<=400;i++){

let cell = document.createElement("div")

cell.className = "cell"

cell.innerHTML = i

cell.onclick = function(){

if(cell.classList.contains("marked")){

cell.classList.remove("marked")

selectedCount--

document.getElementById("count").innerHTML = selectedCount

return
}

if(selectedCount >= 2){

alert("❌ You can only select 2 boards")

return
}

cell.classList.add("marked")

selectedCount++

document.getElementById("count").innerHTML = selectedCount
}

board.appendChild(cell)
}
}

</script>

</body>
</html>
