<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#d6b6e3;
font-family:Arial;
margin:0;
padding:0;
text-align:center;
overflow-y:auto;
}

h1{
color:purple;
font-size:32px;
margin-top:20px;
}

.btn{
background:#00c853;
color:white;
border:none;
padding:14px 40px;
font-size:28px;
border-radius:20px;
margin-top:20px;
cursor:pointer;
}

.info{
font-size:20px;
font-weight:bold;
color:purple;
margin-top:15px;
}

.board{
display:none;
grid-template-columns:repeat(5,50px);
gap:7px;
justify-content:center;
margin-top:30px;
padding-bottom:100px;
}

.cell{
width:32px;
height:32px;
background:#d8cdea;
border:3px solid #e4dff0;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
color:white;
cursor:pointer;
user-select:none;
transition:0.2s;
}
.marked{
background:orange;
color:white;
}

</style>

</head>

<body>

<h1>🎮 Smart Bingo</h1>

<button class="btn" onclick="startGame()">
▶️ Play 10
</button>

<div class="info">
Selected Boards:
<span id="count">0</span>/2
</div>

<div class="board" id="board"></div>

<script>

let selectedCount = 0

function startGame(){

let board = document.getElementById("board")

board.innerHTML = ""

board.style.display = "grid"

selectedCount = 0

document.getElementById("count").innerHTML = selectedCount

for(let i=1;i<=400;i++){

let cell=document.createElement("div")

cell.className="cell"

cell.innerHTML=i

cell.onclick=function(){

if(cell.classList.contains("marked")){

cell.classList.remove("marked")

selectedCount--

document.getElementById("count").innerHTML=selectedCount

return

}

if(selectedCount >= 2){

alert("❌ You can only select 2 boards")

return

}

cell.classList.add("marked")

selectedCount++

document.getElementById("count").innerHTML=selectedCount

}

board.appendChild(cell)

}

}

</script>

</body>
</html>
