<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Bingo</title>

<style>

body{
background:#d8b9e6;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
color:white;
overflow-y:auto;
}

h1{
margin-top:35px;
font-size:38px;
font-weight:bold;
color:purple;
}

.btn{
margin-top:20px;
padding:15px 45px;
font-size:22px;
border:none;
border-radius:20px;
background:#00d84f;
color:white;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
transform:scale(1.05);
}

.welcome{
font-size:42px;
font-weight:bold;
color:white;
margin-top:70px;
text-shadow:0 0 15px rgba(255,255,255,0.5);
animation:fade 2s infinite alternate;
}

.hideWelcome{
display:none;
}

@keyframes fade{
from{
opacity:0.5;
transform:scale(0.95);
}
to{
opacity:1;
transform:scale(1);
}
}

.players{
display:none;
grid-template-columns:repeat(10,26px);
gap:3px;
justify-content:center;
margin-top:25px;
padding-bottom:35px;
}

.player{
width:24px;
height:24px;
background:#d7cfe6;
border:2px solid #e8e1f0;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.2s;
}

.player:hover{
background:orange;
transform:scale(1.1);
}

.board{
display:none;
grid-template-columns:repeat(5,42px);
gap:10px;
justify-content:center;
margin-top:30px;
padding-bottom:40px;
}

.cell{
width:42px;
height:42px;
background:#d7cfe6;
border:2px solid #e8e1f0;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.2s;
}

.cell:hover{
transform:scale(1.08);
}

.marked{
background:orange;
border:2px solid #ffcc80;
transform:scale(1.1);
box-shadow:0 0 12px orange;
}

.headerCell{
background:purple;
border:2px solid #c084fc;
}

#calledNumber{
font-size:75px;
font-weight:bold;
color:orange;
margin-top:25px;
text-shadow:0 0 20px orange;
display:none;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{
transform:scale(1);
}
to{
transform:scale(1.1);
}
}

#winnerText{
display:none;
font-size:45px;
font-weight:bold;
color:gold;
margin-top:20px;
animation:pop 1s infinite alternate;
text-shadow:0 0 20px gold;
}

@keyframes pop{
from{
transform:scale(1);
}
to{
transform:scale(1.15);
}
}

</style>

</head>

<body>

<audio id="callSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<audio id="winSound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>

<h1>🎮 Smart Bingo</h1>

<div class="welcome" id="welcomeText">
Welcome to Smart Bingo
</div>

<button class="btn" onclick="startGame()">
▶️ Play
</button>

<br><br>

<button class="btn" onclick="callNumber()">
🎲 Call Number
</button>

<div id="calledNumber">
0
</div>

<div id="winnerText">
🎉 BINGO WINNER 🎉
</div>

<div class="players" id="players"></div>

<div class="board" id="board"></div>

<script>

let usedNumbers = []

function startGame(){

document.getElementById("welcomeText").classList.add("hideWelcome")

let players = document.getElementById("players")

players.innerHTML = ""

players.style.display = "grid"

for(let i=1;i<=400;i++){

let player = document.createElement("div")

player.className = "player"

player.innerHTML = i

player.onclick = function(){

openBoard(i)

}

players.appendChild(player)

}

}

function openBoard(playerId){

document.getElementById("winnerText").style.display = "none"

let board = document.getElementById("board")

board.innerHTML = ""

board.style.display = "grid"

let bingoText = ["B","I","N","G","O"]

for(let i=0;i<5;i++){

let header = document.createElement("div")

header.className = "cell headerCell"

header.innerHTML = bingoText[i]

board.appendChild(header)

}

let numbers = []

for(let i=1;i<=75;i++){
numbers.push(i)
}

numbers.sort(() => Math.random() - 0.5)

for(let i=0;i<25;i++){

let cell = document.createElement("div")

cell.className = "cell"

if(i == 12){

cell.innerHTML = "FREE"

cell.classList.add("marked")

}else{

cell.innerHTML = numbers[i]

}

cell.onclick = function(){

cell.classList.toggle("marked")

checkWinner()

}

board.appendChild(cell)

}

}

function callNumber(){

document.getElementById("calledNumber").style.display = "block"

if(usedNumbers.length >= 75){

alert("All numbers called")

return

}

let randomNumber

do{

randomNumber = Math.floor(Math.random() * 75) + 1

}
while(usedNumbers.includes(randomNumber))

usedNumbers.push(randomNumber)

document.getElementById("calledNumber").innerHTML = randomNumber

document.getElementById("callSound").play()

let cells = document.querySelectorAll(".cell")

cells.forEach(cell => {

if(cell.innerHTML == randomNumber){

cell.classList.add("marked")

}

})

checkWinner()

}

function checkWinner(){

let cells = document.querySelectorAll(".cell")

let board = []

cells.forEach(cell => {

if(!cell.classList.contains("headerCell")){

board.push(cell)

}

})

for(let row=0; row<5; row++){

let win = true

for(let col=0; col<5; col++){

let index = row * 5 + col

if(!board[index].classList.contains("marked")){

win = false

}

}

if(win){

document.getElementById("winnerText").style.display = "block"

document.getElementById("winSound").play()

return

}

}

}

</script>

</body>

</html>
